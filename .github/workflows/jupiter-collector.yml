name: jupiter-collector
# Read-only Jupiter Perps forward collector. PAPER/research only: public keyless endpoints, default GITHUB_TOKEN, no wallets/keys.
on:
  schedule:
    - cron: '7 * * * *'   # best-effort: GitHub may delay or skip scheduled runs (see collector/jupiter_forward/README.md)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jupiter-collector
  cancel-in-progress: false   # queue, never overlap

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests==2.32.3'
      - name: Check out data-jupiter (orphan branch; created on first run)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin data-jupiter >/dev/null; then
            git fetch origin data-jupiter
            git worktree add -B data-jupiter "$RUNNER_TEMP/data" origin/data-jupiter
          else
            git worktree add --detach "$RUNNER_TEMP/data"
            git -C "$RUNNER_TEMP/data" checkout --orphan data-jupiter
            git -C "$RUNNER_TEMP/data" rm -rfq . || true
          fi
      - name: Collect and export (failures are recorded as rows, not skipped)
        env:
          STAGING: ${{ runner.temp }}/staging
        run: |
          mkdir -p "$RUNNER_TEMP/data/data/jupiter"
          python -I collector/jupiter_forward/ndjson_export.py run \
            --state "$RUNNER_TEMP/data/data/jupiter/state.json" --staging "$STAGING"
      - name: Append to data-jupiter and push (retry on conflict)
        env:
          STAGING: ${{ runner.temp }}/staging
        run: |
          cd "$RUNNER_TEMP/data"
          for i in 1 2 3 4 5 6; do
            if git ls-remote --exit-code --heads origin data-jupiter >/dev/null; then
              git fetch -q origin data-jupiter && git reset -q --hard origin/data-jupiter
            fi
            python -I "$GITHUB_WORKSPACE/collector/jupiter_forward/ndjson_export.py" append --staging "$STAGING" --out data/jupiter
            git add data/jupiter
            git commit -qm "jupiter data $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
            if git push origin HEAD:data-jupiter; then exit 0; fi
            echo "push conflict, retry $i"; git reset -q --hard HEAD~1 || { git update-ref -d HEAD; git rm -rfq --cached . ; git clean -fdq; }; sleep $((i*3))
          done
          echo "push failed after retries" >&2; exit 1
