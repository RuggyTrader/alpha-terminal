# Fly.io config for the ALPHA TERMINAL API (PAPER ONLY).
# Replace `app` with your own unique name. Secrets are set with `fly secrets set`, never here.
app = "alpha-terminal-api-CHANGEME"
primary_region = "iad"   # US East: close to Alpaca, keeps webhook handling well under TradingView's 3 s limit

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/alpha_terminal.db"
  COOKIE_SECURE = "true"
  TRUST_PROXY_HEADERS = "true"
  ENABLE_API_DOCS = "false"
  # Set these two to your real hostnames:
  FRONTEND_ORIGINS = "https://terminal.mydomain.com"
  PUBLIC_API_BASE_URL = "https://api.mydomain.com"

[[mounts]]
  source = "alpha_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: TradingView webhooks must never hit a sleeping machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
